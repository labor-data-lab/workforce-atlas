:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --ink:#16202C; --muted:#5A6676; --line:#DCE2EA;

}

  --c0:#1C2530; --c1:#1F3147; --c2:#28476C; --c3:#3A6497; --c4:#5C8BC6; --c5:#9EC0EE;

:root[data-theme="dark"]{
  --bg:#10151C; --surface:#18202A; --ink:#E5EAF0; --muted:#98A4B3; --line:#2A3542;
  --accent:#86AEE6; --accent-soft:#1E2B3B; --pos:#5CC08C; --neg:#E58080; --warn:#D9A848;
  --c0:#1C2530; --c1:#1F3147; --c2:#28476C; --c3:#3A6497; --c4:#5C8BC6; --c5:#9EC0EE;

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:10px}
.brand{font:700 20px/1 var(--f-display);letter-spacing:.01em;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px}
.brand i{display:inline-grid;grid-template-columns:repeat(3,5px);gap:2px}
.brand i b{width:5px;height:5px;background:var(--c3)} .brand i b:nth-child(2n){background:var(--c5)}
nav.main{display:flex;gap:4px;flex-wrap:wrap}
nav.main a{text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:6px;font-weight:500}
nav.main a[aria-current="page"],nav.main a:hover{color:var(--ink);background:var(--accent-soft)}
.search{position:relative;flex:1 1 300px;min-width:0}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none}
.sugg{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden;z-index:30}
.sugg button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:9px 12px;border:0;background:none;cursor:pointer}
.sugg button:hover,.sugg button.on{background:var(--accent-soft)}
.sugg small{color:var(--muted)}
.keybtn{border:1px solid var(--line);background:none;border-radius:8px;padding:7px 10px;cursor:pointer;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px}
.qpick{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.qpick select{padding:6px 8px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)} .dot.ok{background:var(--pos)} .dot.bad{background:var(--neg)}
main{padding-block:24px 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,4vw,40px);font-weight:700}
h2{font-size:22px;font-weight:600}
h3{font-size:16px;font-weight:600}
.lede{color:var(--muted);max-width:68ch;margin:8px 0 0}
.code{font-family:var(--f-mono);font-size:12px;padding:1px 6px;border:1px solid var(--line);border-radius:4px;color:var(--muted);white-space:nowrap}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumbs a{color:var(--muted)}
.section{margin-top:32px;display:grid;gap:14px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
.sec-head p{margin:0;color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:none;color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label.sel{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:100%;text-transform:none;letter-spacing:0}
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
@media (max-width:860px){.home-grid{grid-template-columns:1fr}}
.tilemap{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}
.tile{aspect-ratio:1;border:0;border-radius:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;font:600 12px/1.1 var(--f-display);min-width:0;max-width:100%;transition:transform .12s}
.tile small{font:400 10px/1.1 var(--f-mono);opacity:.85;margin-top:2px;white-space:nowrap;overflow:hidden;max-width:100%}
.tile:hover{transform:scale(1.08);position:relative;z-index:2}
.tile.dark{color:var(--t-hi)} .tile.light{color:var(--t-lo)}
.tile.empty{background:var(--c0);color:var(--muted)}
@media (max-width:560px){.tile small{display:none}.tile{font-size:10px}}
.cmap svg{width:100%;height:auto;display:block}
.cmap path[data-g]{stroke:var(--surface);stroke-width:.35;cursor:pointer}
.cmap path[data-g]:hover{stroke:var(--ink);stroke-width:1.4}
.cmap .smesh{fill:none;stroke:var(--ink);stroke-opacity:.45;stroke-width:.8;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:10px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:10px;border-radius:2px;display:inline-block}
.toplist{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:2px}
.toplist li a{display:grid;grid-template-columns:22px 1fr auto;gap:8px;padding:5px 6px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:14px}
.toplist li a:hover{background:var(--accent-soft)}
.toplist .n{color:var(--muted);font:12px/1.6 var(--f-mono)}
.toplist .v{font-variant-numeric:tabular-nums;font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:4px;min-width:0}
.kpi .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .val{font:600 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi .meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:end}
.spark{display:block}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.insights{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.insights li{padding:10px 12px;border-left:3px solid var(--c3);background:var(--surface);border-radius:0 8px 8px 0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
td.name{white-space:normal;min-width:180px}
thead th{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em;background:var(--surface);position:sticky;top:0}
th button{border:0;background:none;padding:0;cursor:pointer;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit}
th button[data-dir]::after{content:" ↓"} th button[data-dir="asc"]::after{content:" ↑"}
tbody tr:hover{background:var(--accent-soft)}
tbody tr:last-child td{border-bottom:0}
td a{color:var(--ink);text-decoration:none;font-weight:500} td a:hover{color:var(--accent);text-decoration:underline}
.bar{height:8px;background:var(--c0);border-radius:4px;overflow:hidden;min-width:60px}
.bar b{display:block;height:100%;background:var(--c4)}
.demo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.demo-row{display:grid;grid-template-columns:minmax(90px,1.2fr) 2fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.demo-row:last-child{border-bottom:0}
.demo-row .num{font-variant-numeric:tabular-nums;text-align:right;color:var(--muted);font-size:13px}
.demo-row .num b{color:var(--ink);font-weight:600}
.big-gap{font:600 34px/1 var(--f-display)}
.note{font-size:13px;color:var(--muted);background:var(--accent-soft);border-radius:8px;padding:10px 12px}
.note.warn{background:none;border:1px dashed var(--warn);color:var(--ink)}
.term,.na{border-bottom:1px dotted var(--muted);cursor:help;position:relative}
.na{color:var(--muted);border-bottom-style:dotted}
.term:hover::after,.term:focus::after,.na:hover::after,.na:focus::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 6px);width:max-content;max-width:min(280px,80vw);background:var(--tip-bg);color:var(--tip-fg);font:400 12px/1.45 var(--f-body);text-transform:none;letter-spacing:0;padding:8px 10px;border-radius:6px;z-index:40;white-space:normal;text-align:left}
.setup{max-width:640px;margin:24px auto;display:grid;gap:16px}
.setup ol{margin:0;padding-left:20px;display:grid;gap:6px}
.setup input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:var(--f-mono)}
.err{color:var(--neg);font-size:14px}
.loading{display:grid;gap:10px;max-width:520px;margin:48px auto;text-align:center}
.prog{height:6px;background:var(--c0);border-radius:3px;overflow:hidden}
.prog b{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.cmp-cols{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cmp-cols .chip{display:inline-flex;gap:6px;align-items:center}
.cmp-cols .chip button{border:0;background:none;cursor:pointer;padding:0;color:inherit}
td.best{font-weight:700}
.dl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.dl-grid fieldset{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0;background:var(--surface);min-width:0}
.dl-grid legend{font-weight:600;padding:0 4px}
.dl-grid label.opt{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:14px}
.dl-grid select[multiple]{width:100%;min-height:150px;margin-top:6px}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.gloss dt{font-weight:600}
.gloss dd{margin:2px 0 0;color:var(--muted);font-size:14px}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px}
footer .wrap{padding-block:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

class KeyError extends Error{}
async function api(ds,params){
  const k=qkey(ds,params);
  if(MEM[k])return MEM[k];
  let table=null;
  if(window.QWI_CACHE&&k in window.QWI_CACHE) table=window.QWI_CACHE[k];
  else{
    if(!KEY){ if(OFFLINE) return []; throw new KeyError("Add a Census API key to load data."); }
    let r;
    // retry busy or dropped requests a few times before giving up
    for(let a=0;a<4;a++){
      try{ r=await fetch("https://api.census.gov/data/timeseries/qwi/"+k+"&key="+encodeURIComponent(KEY)); }
      catch(e){ r=null; }
      if(r&&![429,500,502,503,504].includes(r.status))break;
      if(a<3)await new Promise(ok=>setTimeout(ok,1000*2**a));
    }
    if(!r){ throw new Error("Couldn’t reach api.census.gov. Check your internet connection. If you opened this page from inside an app that blocks outside requests, open it in Chrome, Edge, Firefox or Safari instead."); }
    if(r.status===204){table=[];}
    else{
      const txt=await r.text();
      if(/invalid key|key is not valid|missing key/i.test(txt)) throw new KeyError("The Census Bureau didn’t accept this API key. Check that you copied the whole key and activated it from the confirmation email.");
      if(!r.ok) throw new Error("Census API error ("+r.status+"): "+txt.replace(/<[^>]+>/g," ").trim().slice(0,240));
      try{table=JSON.parse(txt);}catch(e){throw new Error("Unexpected reply from the Census API: "+txt.replace(/<[^>]+>/g," ").trim().slice(0,200));}
    }
    if(!k.includes("county:"))RAW[k]=table;
  }
  const out=[];
  if(Array.isArray(table)&&table.length>1){const h=table[0];for(let i=1;i<table.length;i++){const o={};h.forEach((c,j)=>o[c]=table[i][j]);out.push(o);}}
  MEM[k]=out;return out;
}

// QWI doesn't accept state:* so each state is its own request, a few at a time.
async function pool(items,n,fn){const out=new Array(items.length);let i=0;await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{while(i<items.length){const k=i++;out[k]=await fn(items[k],k);}}));return out;}
async function apiStates(ds,get,y,qs,extra,onEach){

    catch(e){if(e instanceof KeyError)throw e;firstErr=firstErr||e;S.failed.add(f);return[];}
    finally{onEach&&onEach();}

async function dlRun(onStep){
  const plan=dlPlan();if(DL.geo==="counties")await loadCountyNames();

  await pool(plan.reqs,6,async r=>{const rows=await api(r.ds,r.p).catch(e=>{if(e instanceof KeyError)throw e;return [];});rows.forEach(x=>out.push(x));n++;onStep(n,plan.reqs.length);});

    if(plan.gk.includes("sex"))o.sex=SEXL[r.sex]||r.sex;if(plan.gk.includes("agegrp"))o.age=AGEL[r.agegrp]||r.agegrp;if(plan.gk.includes("education"))o.education=EDUL[r.education]||r.education;
    DLV.forEach(([k])=>{let v=num(r[k]);if(k==="TurnOvrS"&&v!=null&&v>1)v/=100;o[k]=v;});return o;});
  if(DL.period==="year"){
    const grp=new Map();recs.forEach(o=>{const key=[o.year,o.fips,o.naics,o.sex,o.age,o.education].join("|");if(!grp.has(key))grp.set(key,[]);grp.get(key).push(o);});
    const FLOW=["HirA","Sep","FrmJbC"];
    recs=[...grp.values()].map(list=>{const a=aggCells(list);const o={...list[0]};delete o.quarter;o.quarters_included=list.length;
      DLV.forEach(([k])=>{if(DL.sumFlows&&FLOW.includes(k)){const v=list.map(x=>x[k]).filter(x=>x!=null);o[k]=v.length?v.reduce((p,q)=>p+q,0):null;}else o[k]=a[k];});return o;});
  }
  recs.sort((a,b)=>a.fips.localeCompare(b.fips)||String(a.naics).localeCompare(b.naics)||a.year-b.year||(a.quarter||0)-(b.quarter||0));
  const cols=["year",...(DL.period==="quarter"?["quarter"]:[]),"fips","place","naics","industry",...(plan.gk.includes("sex")?["sex"]:[]),...(plan.gk.includes("agegrp")?["age"]:[]),...(plan.gk.includes("education")?["education"]:[]),...DL.vars,...(DL.period==="year"?["quarters_included"]:[])];

function csvOf(res){const q=(v,c)=>v==null?"":typeof v==="number"?(c==="TurnOvrS"?+v.toFixed(4):DLV.some(x=>x[0]===c)?Math.round(v):v):/[",\n]/.test(v)?`"${String(v).replace(/"/g,'""')}"`:v;

const NAMES=STATES.map(([f,a,n])=>({f,k:n.toLowerCase()})).concat([{f:"11",k:"washington dc"},{f:"11",k:"washington d.c."},{f:"11",k:"dc"}]).sort((a,b)=>b.k.length-a.k.length);
const KW=[];SECTORS.forEach(([c,n,ks])=>{KW.push({c,k:n.toLowerCase()});ks.forEach(k=>KW.push({c,k}));});KW.sort((a,b)=>b.k.length-a.k.length);
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function parseQuery(raw){
  let q=" "+raw.toLowerCase().replace(/[^a-z0-9.\- ]/g," ")+" ";let st=null,ind=null,county=false;
  const naics=/naics\s*([\d-]{2,5})/.exec(q);if(naics&&okInd(naics[1])){ind=naics[1];q=q.replace(naics[0]," ");}
  const fips=/\b(\d{2})(\d{3})?\b/.exec(q);if(fips&&ST[fips[1]]){st=fips[1];county=fips[2]?fips[1]+fips[2]:false;q=q.replace(fips[0]," ");}
  if(!st)for(const n of NAMES){const re=new RegExp("\\b"+reEsc(n.k)+"\\b");if(re.test(q)){st=n.f;q=q.replace(re," ");break;}}
  if(!st){const ab=raw.match(/\b[A-Z]{2}\b/g)||[];for(const a of ab){const s=STATES.find(x=>x[1]===a);if(s){st=s[0];break;}}if(!st&&/^\s*[a-z]{2}\s*$/i.test(raw)){const s=STATES.find(x=>x[1]===raw.trim().toUpperCase());if(s)st=s[0];}}
  if(!ind){const c=/\b(\d{2}(?:-\d{2})?)\b/.exec(q);if(c&&IND[c[1]]&&c[1]!=="00")ind=c[1];}
  if(!ind)for(const k of KW){if(new RegExp("\\b"+reEsc(k.k)+"\\b").test(q)){ind=k.c;break;}}
  // "washington county oregon": match the full county name first, then narrow by any state named
  const low=" "+raw.toLowerCase().replace(/[^a-z0-9.\- ]/g," ").replace(/\s+/g," ").trim()+" ";
  if(!county&&/ (county|parish|borough) /.test(low)&&Object.keys(CNAME).length){
    let hits=Object.keys(CNAME).filter(g=>low.includes(" "+CNAME[g].toLowerCase()+" "));
    if(hits.length){
      const rest=hits.reduce((a,g)=>a.replace(" "+CNAME[g].toLowerCase()+" "," "),low);
      const sn=NAMES.find(n=>new RegExp("\\b"+reEsc(n.k)+"\\b").test(rest));
      if(sn){const h2=hits.filter(g=>g.startsWith(sn.f));if(h2.length){hits=h2;st=sn.f;}}else if(st&&!hits.some(g=>g.startsWith(st)))st=null;
      hits.sort((a,b)=>(CACS[b]?.pop||0)-(CACS[a]?.pop||0));
      return {st:hits[0].slice(0,2),ind,county:hits[0],more:hits.slice(1,4)};
    }
  }
  // county names (loaded from ACS): "travis county", "travis", "cook county illinois"
  if(!county&&Object.keys(CNAME).length){
    const qq=" "+q.replace(/\s+/g," ").trim()+" ";const hits=[];
    for(const g in CNAME){if(st&&!g.startsWith(st))continue;const n=CNAME[g].toLowerCase();const base=n.replace(/ (county|parish|borough|census area|city and borough|municipality|municipio|city)$/,"");
      if(base.length<3)continue;
      if(qq.includes(" "+n+" "))hits.push([g,2]);else if(qq.includes(" "+base+" ")&&!NAMES.some(x=>x.k===base&&!st))hits.push([g,1]);}
    hits.sort((a,b)=>b[1]-a[1]||(CACS[b[0]]?.pop||0)-(CACS[a[0]]?.pop||0));
    if(hits.length)county=hits[0][0];
    return {st,ind,county,more:hits.slice(1,4).map(h=>h[0])};
  }
  return {st,ind,county,more:[]};
}
function suggestions(raw){
  const out=[],t=raw.trim().toLowerCase();if(!t)return out;
  const p=parseQuery(raw);
  if(p.county){if(p.ind)out.push({h:geoHref(p.county,p.ind),l:`${IND[p.ind]} in ${geoFull(p.county)}`,s:"County + industry"});out.push({h:"#c"+p.county,l:geoFull(p.county),s:"County · FIPS "+p.county});(p.more||[]).forEach(g=>out.push({h:"#c"+g,l:geoFull(g),s:"County · FIPS "+g}));}
  if(p.st&&p.ind&&!p.county)out.push({h:`#s${p.st}-i${p.ind}`,l:`${IND[p.ind]} in ${ST[p.st].n}`,s:"State + industry"});
  if(p.st)out.push({h:`#s${p.st}`,l:ST[p.st].n,s:`State · FIPS ${p.st}`});
  if(p.ind)out.push({h:`#i${p.ind}`,l:IND[p.ind],s:`Industry · NAICS ${p.ind}`});
  STATES.filter(([f,a,n])=>n.toLowerCase().startsWith(t)&&f!==p.st).slice(0,3).forEach(([f,,n])=>out.push({h:"#s"+f,l:n,s:"State · FIPS "+f}));
  if(t.length>=4){const hits=Object.keys(SUBNAME).filter(c=>c!==p.ind&&SUBNAME[c].toLowerCase().includes((t.includes(" in ")?t.split(" in ")[0]:t).trim())).sort((a,b)=>a.length-b.length).slice(0,4);
    hits.forEach(c=>out.push({h:p.st?geoHref(p.county||p.st,c):"#i"+c,l:`${SUBNAME[c]}${p.st?" in "+(p.county?geoFull(p.county):ST[p.st].n):""}`,s:`Industry · NAICS ${c}`}));}
  SECTORS.filter(([c,n,ks])=>c!==p.ind&&(n.toLowerCase().includes(t)||ks.some(k=>k.startsWith(t)))).slice(0,3).forEach(([c,n])=>out.push({h:"#i"+c,l:n,s:"Industry · NAICS "+c}));
  return out.slice(0,7);
}

QI.addEventListener("input",()=>{SL=suggestions(QI.value);SI=0;if(!SL.length&&QI.value.trim())SL=[{h:"#about",l:"No match. Try a state name, an industry, or a FIPS code",s:""}];drawSugg();});
QI.addEventListener("keydown",e=>{if(SG.hidden)return;if(e.key==="ArrowDown"){SI=Math.min(SL.length-1,SI+1);drawSugg();e.preventDefault();}else if(e.key==="ArrowUp"){SI=Math.max(0,SI-1);drawSugg();e.preventDefault();}else if(e.key==="Enter"&&SL[SI]){location.hash=SL[SI].h;SG.hidden=true;QI.blur();}else if(e.key==="Escape"){SG.hidden=true;}});
SG.addEventListener("mousedown",e=>{const b=e.target.closest("[data-h]");if(b){e.preventDefault();location.hash=b.dataset.h;SG.hidden=true;QI.value="";}});
QI.addEventListener("blur",()=>setTimeout(()=>SG.hidden=true,100));

/* ---------- Boot ---------- */
function updateKeyBtn(){const d=document.getElementById("keydot"),l=document.getElementById("keylab");d.className="dot"+(S.err?" bad":S.ready?" ok":"");l.textContent=OFFLINE&&!KEY?"Saved data":KEY?(S.err?"Key problem":"Live Census data"):"Add API key";}
document.getElementById("qsel").onchange=e=>selectQuarter(e.target.value);
document.getElementById("keybtn").onclick=()=>{location.hash="#setup";};
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0);});
V.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g&&!V.onclick)location.hash=g.dataset.go;});
updateKeyBtn();render();
if(KEY||OFFLINE){if(!S.ready&&!S.loading)loadAll();}
</script>
</body>
